<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Бумага: тёплый скруглённый квадрат -->
  <rect width="32" height="32" rx="7" fill="#FBFAF8"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1A1714" stroke-opacity="0.18"/>
  <!-- Буква S чернилами -->
  <text x="15" y="23.5" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="600" text-anchor="middle" fill="#1A1714">S</text>
  <!-- Фирменный янтарный акут ó -->
  <line x1="20" y1="8.5" x2="25" y2="5" stroke="#C8841E" stroke-width="2.6" stroke-linecap="round"/>
</svg>
